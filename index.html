<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 6</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 38px;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
        }

        h2 {
            font-size: 24px;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
        }

        h3 {
            font-size: 22px;
            font-weight: bold;
            margin-top: 30px;
            margin-bottom: 15px;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .voting-section {
            display: flex;
            gap: 20px;
            margin-bottom: 35px;
        }

        .btn-vote {
            background-color: #e5e7eb;
            border: 1px solid #9ca3af;
            padding: 10px 22px;
            font-size: 26px;
            font-family: "Times New Roman", Times, serif;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-vote:hover {
            background-color: #d1d5db;
        }

        .btn-vote.voted {
            background-color: #d1d5db;
            border-color: #4b5563;
        }

        .btn-vote:disabled {
            cursor: not-allowed;
            opacity: 0.85;
        }

        .comment-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        textarea {
            width: 100%;
            height: 140px;
            padding: 12px;
            font-size: 16px;
            font-family: monospace;
            border: 1px solid #9ca3af;
            border-radius: 4px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 20px;
            color: #374151;
        }

        textarea:focus {
            outline: none;
            border-color: #4b5563;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-action {
            background-color: #555555;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 16px;
            font-family: "Times New Roman", Times, serif;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-action:hover {
            background-color: #444444;
        }

        .btn-action:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .comments-display {
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            border-top: 1px solid #e5e7eb;
            padding-top: 15px;
            margin-top: 10px;
        }

        .comment-item {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 10px 14px;
            border-radius: 4px;
            margin-bottom: 10px;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        .status-msg {
            font-size: 14px;
            color: #059669;
            margin-bottom: 15px;
            font-weight: bold;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Lab 6</h1>
        <h2>Like or dislike</h2>

        <!-- Voting Section -->
        <div class="voting-section">
            <button id="likeBtn" class="btn-vote" onclick="vote('like')">
                👍<span id="likeCount">100</span>
            </button>
            <button id="dislikeBtn" class="btn-vote" onclick="vote('dislike')">
                👎<span id="dislikeCount">20</span>
            </button>
        </div>

        <!-- Comments Section -->
        <div class="comment-section">
            <h3>Comments</h3>
            <textarea id="commentInput" placeholder="Write a comment..."></textarea>
            
            <div id="statusMsg" class="status-msg"></div>

            <div class="action-buttons">
                <button id="submitBtn" class="btn-action" onclick="submitComment()">Submit</button>
                <button id="clearBtn" class="btn-action" onclick="resetData()">Clear</button>
            </div>

            <!-- Display Comments List -->
            <div id="commentsList" class="comments-display">
                <p style="color: #6b7280; font-size: 14px; text-align: center; font-family: Arial, sans-serif;">No comments yet.</p>
            </div>
        </div>
    </div>

    <script>
        // Cookie Helper Functions
        function setCookie(name, value, days) {
            let expires = "";
            if (days) {
                const date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + encodeURIComponent(value) + expires + "; path=/";
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) == ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) == 0) return decodeURIComponent(c.substring(nameEQ.length, c.length));
            }
            return null;
        }

        function eraseCookie(name) {
            document.cookie = name + '=; Max-Age=-99999999; path=/';
        }

        // Initialize State from Cookies or Default Values (100 likes, 20 dislikes)
        let likes = getCookie('likes') !== null ? parseInt(getCookie('likes')) : 100;
        let dislikes = getCookie('dislikes') !== null ? parseInt(getCookie('dislikes')) : 20;
        let userVote = getCookie('userVote'); // 'like', 'dislike', or null

        let commentsJson = getCookie('comments');
        let comments = commentsJson ? JSON.parse(commentsJson) : [];
        let hasCommented = getCookie('hasCommented') === 'true';

        // Run on Page Load
        window.onload = function() {
            updateCounters();
            renderComments();
            applyStateUI();
        };

        function updateCounters() {
            document.getElementById('likeCount').innerText = likes;
            document.getElementById('dislikeCount').innerText = dislikes;
        }

        function renderComments() {
            const listContainer = document.getElementById('commentsList');
            if (comments.length === 0) {
                listContainer.innerHTML = '<p style="color: #6b7280; font-size: 14px; text-align: center; font-family: Arial, sans-serif;">No comments yet.</p>';
                return;
            }
            
            listContainer.innerHTML = '';
            comments.forEach(comment => {
                const div = document.createElement('div');
                div.className = 'comment-item';
                div.innerText = comment;
                listContainer.appendChild(div);
            });
        }

        function applyStateUI() {
            const likeBtn = document.getElementById('likeBtn');
            const dislikeBtn = document.getElementById('dislikeBtn');
            const commentInput = document.getElementById('commentInput');
            const submitBtn = document.getElementById('submitBtn');

            // Handle Vote UI state
            if (userVote === 'like') {
                likeBtn.classList.add('voted');
                likeBtn.disabled = true;
                dislikeBtn.disabled = true;
            } else if (userVote === 'dislike') {
                dislikeBtn.classList.add('voted');
                likeBtn.disabled = true;
                dislikeBtn.disabled = true;
            } else {
                likeBtn.classList.remove('voted');
                dislikeBtn.classList.remove('voted');
                likeBtn.disabled = false;
                dislikeBtn.disabled = false;
            }

            // Handle Comment UI state
            if (hasCommented) {
                commentInput.disabled = true;
                commentInput.value = "You have already submitted a comment.";
                submitBtn.disabled = true;
            } else {
                commentInput.disabled = false;
                submitBtn.disabled = false;
            }
        }

        // Handle Voting
        function vote(type) {
            if (userVote) return;

            if (type === 'like') {
                likes++;
                userVote = 'like';
            } else if (type === 'dislike') {
                dislikes++;
                userVote = 'dislike';
            }

            setCookie('likes', likes, 7);
            setCookie('dislikes', dislikes, 7);
            setCookie('userVote', userVote, 7);

            updateCounters();
            applyStateUI();
        }

        // Handle Comment Submission
        function submitComment() {
            if (hasCommented) return;

            const commentInput = document.getElementById('commentInput');
            const commentText = commentInput.value.trim();

            if (commentText === "" || commentText === "Write a comment...") {
                alert("Please write a comment before submitting.");
                return;
            }

            comments.push(commentText);
            hasCommented = true;

            setCookie('comments', JSON.stringify(comments), 7);
            setCookie('hasCommented', 'true', 7);

            commentInput.value = "";
            renderComments();
            applyStateUI();
        }

        // Reset / Clear Functionality
        function resetData() {
            likes = 100;
            dislikes = 20;
            userVote = null;
            comments = [];
            hasCommented = false;

            eraseCookie('likes');
            eraseCookie('dislikes');
            eraseCookie('userVote');
            eraseCookie('comments');
            eraseCookie('hasCommented');

            updateCounters();
            renderComments();
            applyStateUI();

            const statusMsg = document.getElementById('statusMsg');
            statusMsg.innerText = "Successfully cleared and reset!";
            setTimeout(() => {
                statusMsg.innerText = "";
            }, 3000);
        }
    </script>
</body>
</html>
